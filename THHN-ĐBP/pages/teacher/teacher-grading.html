<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Chấm bài & Nhận xét</title>

  <link rel="stylesheet" href="../../assets/styles.css">
  <meta name="theme-color" content="#2563eb"/>

  <!-- ✅ Đồng bộ: config nên load sớm để teacher.js/core.js có brand & SCRIPT_URL -->
  <script src="../../assets/config.js"></script>

  <style>
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:900;font-size:12px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:980px){.grid2{grid-template-columns:1fr}}
    .dcard{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    @media(max-width:980px){.split{grid-template-columns:1fr}}
    textarea{min-height:160px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  </style>
</head>

<body data-active="grading">
  <div id="topbar"></div>

  <main class="container">
    <section class="card" style="padding:16px">
      <div class="row">
        <div>
          <h1 style="margin:0">Chấm bài & Nhận xét 📝</h1>
          <div class="muted" id="sub">—</div>
        </div>
        <div class="pill" id="me">—</div>
      </div>

      <div class="actions mt">
        <button class="btn ghost" id="btnBack" type="button">← Quay lại danh sách bài nộp</button>
        <button class="btn ghost" id="btnInsights" type="button">📊 Thống kê & Phân tích</button>
      </div>

      <div class="split mt">
        <!-- TRÁI: Bài nộp -->
        <div class="dcard">
          <div style="font-weight:900">📨 Bài nộp</div>
          <div class="muted mt" id="meta">—</div>

          <label class="mt">Đề bài (tóm tắt)</label>
          <textarea id="taskBody" readonly></textarea>

          <label class="mt">Bài làm của học sinh</label>
          <textarea id="answer" readonly></textarea>
        </div>

        <!-- PHẢI: Chấm bài -->
        <div class="dcard">
          <div class="row">
            <div style="font-weight:900">✅ Chấm điểm & lưu nhận xét</div>
            <span class="badge ok">● Sẵn sàng</span>
          </div>

          <div class="grid2 mt">
            <div>
              <label>Điểm</label>
              <input id="score" placeholder="Ví dụ: 8">
            </div>
            <div>
              <label>Thang điểm</label>
              <input id="scoreMax" value="10">
            </div>
          </div>

          <label class="mt">Rubric (tiêu chí chấm) – bản chụp</label>
          <textarea id="rubric" class="mono" readonly></textarea>

          <div class="actions mt">
            <button class="btn" id="btnAI" type="button">🤖 AI gợi ý nhận xét</button>
            <button class="btn ghost" id="btnSaveQuickHS" type="button">💬 Lưu nhanh (Học sinh)</button>
            <button class="btn ghost" id="btnSaveQuickPH" type="button">💬 Lưu nhanh (Phụ huynh)</button>
          </div>

          <label class="mt">Nhận xét cho HỌC SINH</label>
          <textarea id="fbHS" placeholder="Ví dụ: Con làm tốt 2 ý... / Cần bổ sung 1 ý..."></textarea>

          <label class="mt">Nhận xét cho PHỤ HUYNH</label>
          <textarea id="fbPH" placeholder="Ví dụ: Mỗi ngày luyện 10 phút... / Nhắc con đọc kỹ đề..."></textarea>

          <label class="mt">Nhận xét lưu HỒ SƠ</label>
          <textarea id="fbProfile" placeholder="Khách quan, tập trung vào kỹ năng và tiến bộ..."></textarea>

          <div class="actions mt">
            <button class="btn" id="btnSave" type="button">💾 Lưu chấm bài</button>
          </div>

          <div class="muted mt" id="hint">—</div>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" hidden></div>
  </main>

  <!-- ✅ SSOT: core -> api -> teacher -->
  <script src="../../assets/core.js"></script>
  <script src="../../assets/api.js"></script>
  <script src="../../assets/teacher.js"></script>

  <script>
    function toast(msg){
      const t=document.getElementById("toast");
      t.hidden=false;t.textContent=msg||"—";t.classList.add("show");
      clearTimeout(window.__t);
      window.__t=setTimeout(()=>{t.classList.remove("show");t.hidden=true;},2400);
    }
    function qp(name){
      const u=new URL(location.href);
      return u.searchParams.get(name)||"";
    }

    // ✅ Đồng bộ: TEACHER guard theo core.js
    const session = requireRole("TEACHER");
    if(!session) { throw new Error("Đang chuyển về đăng nhập..."); }

    // ✅ Đồng bộ: token có thể là token/sessionId
    const token = (session?.token || session?.sessionId || "");

    // ✅ Đồng bộ: classId ưu tiên session -> localStorage -> rỗng (không fallback cứng 5A1)
    function currentClassId(){
      const cid = (session?.classId)
        || (window.getSession?.()?.classId)
        || localStorage.getItem("hedu_class")
        || localStorage.getItem("hedu_teacher_classId")
        || "";
      // getTeacherClassId() là helper trong teacher.js (chuẩn hoá)
      return (typeof getTeacherClassId === "function") ? getTeacherClassId(cid) : String(cid||"").trim().toUpperCase();
    }

    // pill hiển thị: Tên GV • Lớp hiện tại
    const meEl = document.getElementById("me");
    function renderMe(){
      const cid = currentClassId() || "—";
      const name = session.displayName||session.fullName||"Giáo viên";
      if (meEl) meEl.textContent = `${name} • ${cid}`;
    }
    renderMe();

    const submissionId = qp("submissionId");

    const btnBack = document.getElementById("btnBack");
    const btnInsights = document.getElementById("btnInsights");
    const sub = document.getElementById("sub");
    const meta = document.getElementById("meta");
    const taskBody = document.getElementById("taskBody");
    const answer = document.getElementById("answer");
    const rubric = document.getElementById("rubric");

    const score = document.getElementById("score");
    const scoreMax = document.getElementById("scoreMax");
    const fbHS = document.getElementById("fbHS");
    const fbPH = document.getElementById("fbPH");
    const fbProfile = document.getElementById("fbProfile");
    const hint = document.getElementById("hint");

    const btnAI = document.getElementById("btnAI");
    const btnSaveQuickHS = document.getElementById("btnSaveQuickHS");
    const btnSaveQuickPH = document.getElementById("btnSaveQuickPH");
    const btnSave = document.getElementById("btnSave");

    btnBack.onclick=()=>location.href="./teacher-submissions.html";
    btnInsights.onclick=()=>location.href="./teacher-insights.html";

    let _ctx = { taskId:"", studentId:"", grade:"", subject:"", textbook:"" };

    function safeSystem_(r){
      const sys = (r && r.system) ? r.system : {};
      return {
        grade: sys.grade || "",
        subject: sys.subject || "",
        textbook: sys.textbook || ""
      };
    }

    async function load(){
      try{
        if(!submissionId) throw new Error("Thiếu mã bài nộp (submissionId).");

        const cid = currentClassId();
        if(!cid) throw new Error("Thiếu classId của giáo viên. Vui lòng đăng xuất/đăng nhập lại.");

        const r = await api("getSubmissionDetail", { token, classId: cid, submissionId });

        const sys = safeSystem_(r);
        sub.textContent = `Khối ${sys.grade||"—"} • ${sys.subject||"—"} • ${sys.textbook||"—"}`;

        const s = r.submission || {};
        const t = r.task || {};
        const fb = r.feedback || null;

        _ctx.taskId = s.taskId || t.taskId || "";
        _ctx.studentId = s.studentId || "";
        _ctx.grade = t.grade || sys.grade || "";
        _ctx.subject = t.subject || sys.subject || "";
        _ctx.textbook = t.textbook || sys.textbook || "";

        meta.textContent = `Học sinh: ${_ctx.studentId||"—"} • Bài: ${_ctx.taskId||"—"} • Nộp lúc: ${s.createdAt||""}`;
        taskBody.value = (t.body || "").trim();
        answer.value = (s.answer || "").trim();
        rubric.value = (t.rubric || "").trim();

        if(fb){
          score.value = fb.score || "";
          scoreMax.value = fb.scoreMax || "10";
          fbHS.value = fb.feedbackHS || "";
          fbPH.value = fb.feedbackPH || "";
          fbProfile.value = fb.feedbackProfile || "";
          hint.textContent = "Đã có nhận xét trước đó. Anh có thể chỉnh sửa và lưu lại bản mới.";
        }else{
          hint.textContent = "Chưa có nhận xét. Anh có thể dùng AI để gợi ý rồi chỉnh lại cho chuẩn ✅";
        }

        renderMe();
        toast("Đã tải bài ✅");
      }catch(e){
        toast(e.message||"Không tải được bài nộp.");
      }
    }

    // ✅ Đồng bộ: AI action có thể chưa có trong Code.gs -> fallback nhẹ
    async function callAiSuggest_(payload){
      // 1) action chính
      const r1 = await api("aiSuggestFeedback", payload);
      if(r1 && r1.ok !== false) return r1;

      const msg = String(r1?.error || r1?.message || "");
      // 2) fallback (nếu backend dùng action ask/ai/teacherAiFeedback...)
      if(/unknown action/i.test(msg) || /Unknown action/i.test(msg)){
        // thử action phổ biến "ask" (nếu Code.gs có)
        const r2 = await api("ask", Object.assign({ kind:"teacher_feedback" }, payload));
        return r2;
      }
      return r1;
    }

    btnAI.onclick = async ()=>{
    try{
      if(!rubric.value.trim()) return toast("Bài này chưa có rubric (tiêu chí chấm).");
      if(!answer.value.trim()) return toast("Bài làm đang trống.");

      const r = await api("aiSuggestFeedback",{
        token,
        grade:_ctx.grade,
        subject:_ctx.subject,
        textbook:_ctx.textbook,
        rubric: rubric.value,
        answer: answer.value
      });

      // ✅ Nếu backend trả sẵn 3 trường riêng thì ưu tiên luôn
      const hs0 = String(r?.feedbackHS || r?.hs || r?.student || "").trim();
      const ph0 = String(r?.feedbackPH || r?.ph || r?.parent || "").trim();
      const pf0 = String(r?.feedbackProfile || r?.profile || r?.record || r?.portfolio || "").trim();

      if (hs0 || ph0 || pf0){
        if(hs0) fbHS.value = hs0;
        if(ph0) fbPH.value = ph0;
        if(pf0) fbProfile.value = pf0;
        toast("AI đã gợi ý cho 3 ô ✅");
        return;
      }

      // ✅ Legacy: backend trả 1 khối text/markdown (đúng trường hợp của ông chủ)
      const merged = String(r?.feedbackText || r?.hint || r?.text || "").trim();
      if(!merged) return toast(r?.error || "AI chưa trả nội dung gợi ý.");

      // ===== Splitter: tách theo heading markdown "## Nhận xét cho HỌC SINH" ... (không cần dấu :)
      function split3BoxesByMarkdown_(txt){
        const lines = String(txt||"").replace(/\r/g,"").split("\n");

        const isHS = (s)=>/(nhận\s*xét.*học\s*sinh|\bhọc\s*sinh\b)/i.test(s);
        const isPH = (s)=>/(nhận\s*xét.*phụ\s*huynh|\bphụ\s*huynh\b)/i.test(s);
        const isPF = (s)=>/(nhận\s*xét.*hồ\s*sơ|\bhồ\s*sơ\b|lưu\s*hồ\s*sơ|profile)/i.test(s);

        const idx = { hs:-1, ph:-1, pf:-1 };

        for(let i=0;i<lines.length;i++){
          const raw = lines[i].trim();
          // bắt heading: "#", "##", "###", hoặc line mở đầu rõ nghĩa
          const head = raw.replace(/^#{1,6}\s*/,"").trim();
          if(idx.hs<0 && (raw.startsWith("#") && isHS(head))) idx.hs=i;
          if(idx.ph<0 && (raw.startsWith("#") && isPH(head))) idx.ph=i;
          if(idx.pf<0 && (raw.startsWith("#") && isPF(head))) idx.pf=i;
        }

        // Nếu thiếu heading, vẫn thử bắt bằng cụm từ không có #
        if(idx.hs<0 || idx.ph<0 || idx.pf<0){
          for(let i=0;i<lines.length;i++){
            const raw = lines[i].trim();
            if(idx.hs<0 && isHS(raw)) idx.hs=i;
            if(idx.ph<0 && isPH(raw)) idx.ph=i;
            if(idx.pf<0 && isPF(raw)) idx.pf=i;
          }
        }

        if(idx.hs<0 && idx.ph<0 && idx.pf<0) return null;

        // sắp xếp theo vị trí xuất hiện
        const arr = [
          {k:"hs", i: idx.hs},
          {k:"ph", i: idx.ph},
          {k:"pf", i: idx.pf},
        ].filter(x=>x.i>=0).sort((a,b)=>a.i-b.i);

        function sliceBlock(from, to){
          const block = lines.slice(from, to).join("\n").trim();
          // bỏ dòng heading đầu block (nếu có)
          return block.replace(/^#{1,6}\s*.*$/m, "").trim().replace(/^\s*[-–—]{3,}\s*$/gm,"").trim();
        }

        const out = { hs:"", ph:"", pf:"" };
        for(let j=0;j<arr.length;j++){
          const cur = arr[j];
          const next = arr[j+1];
          const a = cur.i;
          const b = next ? next.i : lines.length;
          out[cur.k] = sliceBlock(a, b);
        }

        return out;
      }

      const sp = split3BoxesByMarkdown_(merged);

      if(sp && (sp.hs || sp.ph || sp.pf)){
        if(sp.hs) fbHS.value = sp.hs;
        if(sp.ph) fbPH.value = sp.ph;
        if(sp.pf) fbProfile.value = sp.pf;
        toast("AI đã tách và điền đúng 3 ô ✅");
        return;
      }

      // Fallback cuối: nếu không tách được thì vẫn đổ vào HS để không mất nội dung
      fbHS.value = merged;
      toast("AI trả 1 khối nội dung — tạm đưa vào ô Học sinh (chưa tách được) ⚠️");

    }catch(e){
      toast(e.message||"Gọi AI bị lỗi.");
    }
  };


    btnSaveQuickHS.onclick = async ()=>{
      try{
        if(!fbHS.value.trim()) return toast("Nhận xét cho học sinh đang trống.");
        await api("saveFeedbackTyped",{
          token, classId: currentClassId(),
          studentId:_ctx.studentId,
          taskId:_ctx.taskId,
          feedbackText: fbHS.value.trim(),
          feedbackType:"HS"
        });
        toast("Đã lưu nhanh (Học sinh) ✅");
      }catch(e){
        toast(e.message||"Lưu nhanh bị lỗi.");
      }
    };

    btnSaveQuickPH.onclick = async ()=>{
      try{
        if(!fbPH.value.trim()) return toast("Nhận xét cho phụ huynh đang trống.");
        await api("saveFeedbackTyped",{
          token, classId: currentClassId(),
          studentId:_ctx.studentId,
          taskId:_ctx.taskId,
          feedbackText: fbPH.value.trim(),
          feedbackType:"PH"
        });
        toast("Đã lưu nhanh (Phụ huynh) ✅");
      }catch(e){
        toast(e.message||"Lưu nhanh bị lỗi.");
      }
    };

    btnSave.onclick = async ()=>{
      try{
        const sc = score.value.trim();
        const sm = scoreMax.value.trim() || "10";

        if(!fbHS.value.trim() && !fbPH.value.trim() && !fbProfile.value.trim()){
          return toast("Cần có ít nhất 1 nội dung nhận xét trước khi lưu.");
        }

        await api("saveGrade",{
          token, classId: currentClassId(),
          taskId:_ctx.taskId,
          studentId:_ctx.studentId,
          score: sc,
          scoreMax: sm,
          feedbackHS: fbHS.value.trim(),
          feedbackPH: fbPH.value.trim(),
          feedbackProfile: fbProfile.value.trim(),
          rubricSnapshot: rubric.value.trim(),
          aiUsed: true
        });

        toast("Đã lưu chấm bài ✅");
      }catch(e){
        toast(e.message||"Lưu chấm bài bị lỗi.");
      }
    };

    (async ()=>{
      // ✅ topbar chuẩn do teacher.js dựng (đồng bộ các trang GV)
      if (typeof renderTeacherTopbar === "function") renderTeacherTopbar("grading");
      await load();
    })();
  </script>
</body>
</html>
